name: Validate and distribute

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_PROMPT_DISABLED: '1'
  GH_DEBUG: ''
  DEBUG: ''
  GH_NO_UPDATE_NOTIFIER: '1'

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix flake check --all-systems --no-build --no-update-lock-file
      - run: nix develop .#ci --no-update-lock-file --command just check

  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
      - run: deno run --frozen -A scripts/setup-ci.ts --editor-only
      - id: identity
        run: |
          build_id=$(nvim --headless -u NONE -i NONE -l scripts/build-id.lua)
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

  native:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    env:
      BUILD_ID: ${{ needs.identity.outputs.build_id }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
          cache: true
          cache-hash: ${{ hashFiles('.deno-version', 'deno.json', 'deno.lock') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools libcurl4-openssl-dev libssl-dev zlib1g-dev
      - run: deno run --frozen -A scripts/setup-ci.ts
      - name: Select Rust toolchain
        id: toolchain
        run: |
          test "$(nvim --headless -u NONE -i NONE -l scripts/build-id.lua)" = "$BUILD_ID"
          nvim --version | head -1
          git --version
          rust_version=$(deno eval --no-config 'console.log(JSON.parse(Deno.readTextFileSync("distribution.json")).rust)')
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$rust_version" --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: daemon -> target
          key: ${{ matrix.target }}-${{ steps.toolchain.outputs.image }}-${{ hashFiles('scripts/build-daemon.sh') }}
          cache-workspace-crates: false
          cache-bin: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --frozen -A scripts/release.ts fetch "$BUILD_ID" .wadackel/qa/dist --target "$TARGET"
      - if: steps.release.outputs.reused != 'true'
        run: sh scripts/build-daemon.sh "$TARGET" .wadackel/qa/dist "$BUILD_ID"
      - name: Validate daemon
        run: deno run --no-config -A scripts/validate-daemon.ts ".wadackel/qa/dist/diffreel-daemon-$TARGET" "$TARGET" "$BUILD_ID"
      - name: Rust tests
        run: cargo test --locked --manifest-path daemon/Cargo.toml
      - name: Lua and Deno tests
        run: deno task test --daemon ".wadackel/qa/dist/diffreel-daemon-$TARGET" --jobs 2
      - name: Installation tests
        run: deno run --frozen -A tests/install_integration.ts --daemon ".wadackel/qa/dist/diffreel-daemon-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-${{ matrix.target }}
          path: .wadackel/qa/dist/diffreel-daemon-${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.target }}
          path: .wadackel/qa/ci
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    needs: [identity, check, native]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    concurrency:
      group: daemon-${{ needs.identity.outputs.build_id }}
      cancel-in-progress: false
    env:
      BUILD_ID: ${{ needs.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: daemon-*
          path: .wadackel/qa/dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --frozen -A scripts/release.ts publish "$BUILD_ID" .wadackel/qa/dist --commit "$GITHUB_SHA"

  consumer:
    needs: [identity, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
          cache: true
          cache-hash: ${{ hashFiles('.deno-version', 'deno.json', 'deno.lock') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev
      - run: |
          deno run --frozen -A scripts/setup-ci.ts
      - env:
          DIFFREEL_COMMIT: ${{ github.sha }}
          DIFFREEL_EXPECTED_ID: ${{ needs.identity.outputs.build_id }}
        run: deno run --frozen -A tests/consumer.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-${{ matrix.runner }}
          path: .wadackel/qa/consumer
          include-hidden-files: true
          if-no-files-found: warn

  plugin-release:
    needs: [check, native, publish, consumer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
      - name: Match the pending release to the tested commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --frozen -A scripts/plugin-release.ts
      - if: steps.candidate.outputs.publish == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
