[package]
name = "diffreel-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gix = { version = "0.87.1", default-features = false, features = ["sha1", "sha256", "revision"] }
imara-diff = { version = "0.2.0", default-features = false }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
